name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: 22

jobs:
  quality:
    name: Lint · Tipos · Testes · Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Lint
        run: npm run lint -- --max-warnings=0

      - name: Formatação
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Testes de unidade (com cobertura)
        run: npm run test:coverage

      - name: Build
        run: npm run build
        env:
          # Opcional: sem o secret, o jogo funciona no modo só-local.
          VITE_SHEETS_API_URL: ${{ secrets.VITE_SHEETS_API_URL }}

      - name: Guardar build para os próximos jobs
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7

  e2e:
    name: E2E (iPhone 14 · Galaxy Tab)
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Instalar navegadores (Chromium + WebKit)
        run: npx playwright install --with-deps chromium webkit

      # O e2e faz o próprio build apontando para uma planilha simulada
      # (tests/e2e/fake-sheets.ts); o deploy usa o build do job "quality".
      - name: Testes E2E
        run: npm run test:e2e

      - name: Relatório do Playwright
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  deploy:
    name: Deploy no GitHub Pages
    # Push na main ou "Run workflow" manual na main (ex.: depois de criar o secret).
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [quality, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
